<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaalFlitser</title>
<meta name="description" content="Maak een foto van je woordenlijst en krijg flitskaarten. Alles blijft in je browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='7' y='9' width='18' height='14' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem('tf-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<header class="bar">
  <a class="logo" href="#/" aria-label="TaalFlitser">taal<b>flitser</b></a>
  <nav>
    <button id="btn-lang" class="ghost" type="button"></button>
    <button id="btn-theme" class="ghost" type="button" aria-label="Invert colours"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="display:block"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
  </nav>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" accept="image/*" multiple hidden>
<input type="file" id="import-in" accept="application/json,.json" hidden>
<script src="scan.js"></script>
<script src="app.js"></script>
</body>
</html>
